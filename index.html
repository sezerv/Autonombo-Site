function el(tag, cls, text){ const n=document.createElement(tag); if(cls) n.className=cls; if(text!=null) n.textContent=text; return n; }

function render(lang){
  const t = COPY[lang] || COPY.en;
  document.documentElement.lang = lang;
  document.querySelectorAll("[data-t]").forEach(n => { const v = t[n.dataset.t]; if(typeof v === "string") n.textContent = v; });

  const marks = document.getElementById("marks"); marks.innerHTML = "";
  t.marks.forEach(m => { const d=el("div"); d.appendChild(el("div","v",m.v)); d.appendChild(el("div","k",m.k)); marks.appendChild(d); });

  const dom = document.getElementById("domains"); dom.innerHTML = "";
  t.domains.forEach(d => dom.appendChild(el("span",null,d)));

  const caps = document.getElementById("caps"); caps.innerHTML = "";
  t.capabilities.forEach(c => { const a=el("article"); a.appendChild(el("div","no",c.no)); a.appendChild(el("h3",null,c.title)); a.appendChild(el("p",null,c.body)); caps.appendChild(a); });

  const svc = document.getElementById("svc"); svc.innerHTML = "";
  t.services.forEach(s => {
    const a=el("article"); a.appendChild(el("h3",null,s.title)); a.appendChild(el("p",null,s.body));
    const ul=el("ul"); s.points.forEach(p => { const li=el("li"); li.appendChild(el("b",null,"—")); li.appendChild(el("span",null,p)); ul.appendChild(li); });
    a.appendChild(ul); svc.appendChild(a);
  });

  const st = document.getElementById("status"); st.innerHTML = "";
  t.status.forEach(r => { const d=el("div"); d.appendChild(el("span","k",r.k)); d.appendChild(el("span","v",r.v)); st.appendChild(d); });

  document.querySelectorAll(".lang button").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.lang === lang)));
  document.title = lang === "tr"
    ? "Autonombo — Otonom araçlar ve kara robotları"
    : "Autonombo — Autonomous vehicles & ground robotics";
}

let stored = null;
try { stored = localStorage.getItem("autonombo-lang"); } catch(e){}
const initial = stored || "en";
render(initial);

document.querySelectorAll(".lang button").forEach(b => b.addEventListener("click", () => {
  render(b.dataset.lang);
  try { localStorage.setItem("autonombo-lang", b.dataset.lang); } catch(e){}
}));

const io = new IntersectionObserver(entries => {
  entries.forEach(e => { if(!e.isIntersecting) return; e.target.style.opacity="1"; e.target.style.transform="none"; io.unobserve(e.target); });
}, { threshold: 0.08 });
document.querySelectorAll("[data-reveal]").forEach(n => {
  if(n.getBoundingClientRect().top > window.innerHeight * 0.9){ n.style.opacity="0"; n.style.transform="translateY(18px)"; }
  io.observe(n);
});
</script>
</body>
</html>
